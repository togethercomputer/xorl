name: CPU Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: pyproject.toml

      # ``pyproject.toml`` pins torch to a CUDA 13.2 wheel. That wheel runs fine
      # on a CPU-only host, but it is a multi-gigabyte download, so swap in the
      # CPU build for this job.
      #
      # The versions are pinned to the same release pyproject.toml pins. Left
      # unpinned, this resolves to the newest CPU build on the index -- which
      # silently ran the whole CPU suite on torch 2.13.0 against a project that
      # pins 2.12.1. Keep these two in step with the torch/torchvision URLs in
      # pyproject.toml; tests/distributed/test_native_fp8_fsdp2_materialization.py
      # asserts the release and will fail loudly if they drift apart.
      - name: Install dependencies
        run: |
          uv sync --group test
          uv pip install torch==2.12.1 torchvision==0.27.1 --index-url https://download.pytorch.org/whl/cpu --reinstall

      # ``--no-sync`` keeps the CPU torch installed above. A bare ``uv run``
      # re-syncs against the lock first, which would reinstall the CUDA wheel
      # and undo the swap.
      - name: Run CPU tests
        run: uv run --no-sync pytest -m "cpu" --tb=short --durations=10
