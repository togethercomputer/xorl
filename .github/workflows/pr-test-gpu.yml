name: GPU Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Lets a maintainer run the suite on demand once a runner exists, without
  # waiting for a push.
  workflow_dispatch:

concurrency:
  group: gpu-tests-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads the checkout. Without this the token
# inherits the repository default, which may include write scopes.
permissions:
  contents: read

jobs:
  gpu-tests:
    # Three gates, all of which must hold.
    #
    # 1. vars.GPU_RUNNER_AVAILABLE must be 'true'. The runner scale sets serving
    #    this org are registered against the organization and land in the Default
    #    runner group, which disallows public repositories -- so this repository
    #    currently has no runner able to claim the job. Without this gate the job
    #    queues forever rather than failing, which is worse than not running: a
    #    permanently pending check trains people to ignore CI, and as a required
    #    check it would block every pull request with no diagnostic. Skipped jobs
    #    report as skipped, not pending. Set the variable (Settings > Actions >
    #    Variables) once a repository-scoped scale set exists; no code change.
    #
    # 2. Not a draft pull request.
    #
    # 3. The ref lives in this repository. This job runs on a self-hosted H100.
    #    On a public repository a pull request from a fork must never reach that
    #    host: the runner would execute the fork's code, with its checkout, its
    #    workflow-adjacent scripts and its test payloads, on hardware inside our
    #    network. Fork contributions are still covered by the CPU job, which runs
    #    on ephemeral GitHub-hosted runners; a maintainer who wants GPU coverage
    #    for a fork pull request pushes the branch to this repository first.
    if: >-
      vars.GPU_RUNNER_AVAILABLE == 'true' &&
      (github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: self-hosted-h100-2gpu-cu131
    timeout-minutes: 30
    container:
      # Matches the CUDA 13.2 torch/triton wheels pinned in ``pyproject.toml``.
      # Kernel backends that compile at runtime (TileLang, FlashQLA) need an
      # ``nvcc`` from the same CUDA major/minor line as those wheels. GPUs reach
      # the job through the Actions Runner Controller pod template, not a docker
      # flag, so no ``options: --gpus`` is needed here.
      image: nvcr.io/nvidia/cuda:13.2.1-cudnn-devel-ubuntu24.04

    steps:
      - name: Install system tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # checkout stores the token in .git/config unless told not to, where it
          # can leak into anything that later archives the workspace.
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install dependencies
        run: uv sync --group test

      - name: Run GPU tests
        run: uv run pytest -m "not e2e and not cpu" --tb=short --durations=10
