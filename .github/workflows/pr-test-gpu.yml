name: GPU Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Lets a maintainer run the suite on demand once a runner exists, without
  # waiting for a push.
  workflow_dispatch:

concurrency:
  group: gpu-tests-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads the checkout. Without this the token
# inherits the repository default, which may include write scopes.
permissions:
  contents: read

jobs:
  gpu-tests:
    # Two gates, both of which must hold.
    #
    # 1. Not a draft pull request.
    #
    # 2. The ref lives in this repository. This job runs on a self-hosted H100.
    #    On a public repository a pull request from a fork must never reach that
    #    host: the runner would execute the fork's code, with its checkout, its
    #    workflow-adjacent scripts and its test payloads, on hardware inside our
    #    network. Fork contributions are still covered by the CPU job, which runs
    #    on ephemeral GitHub-hosted runners; a maintainer who wants GPU coverage
    #    for a fork pull request pushes the branch to this repository first.
    #
    # Note: until a runner scale set scoped to this repository exists, a job that
    # passes these gates has nothing to claim it and stays queued rather than
    # failing. `gh run list --workflow=pr-test-gpu.yml` is how you spot that.
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository)
    # Scale set defined in togethercomputer/xorl-ci. Its runner pod holds the
    # GPUs directly, so there is deliberately no `container:` here: a job
    # container would be scheduled without GPU resources. The runner image is
    # built FROM nvcr.io/nvidia/cuda:13.2.1-cudnn-devel-ubuntu24.04, so the
    # toolkit still matches the torch 2.12.1+cu132 and TileLang cu131 wheels
    # pinned in pyproject.toml -- which matters because TileLang and FlashQLA
    # compile kernels at runtime through nvcc.
    runs-on: xorl-2-h100-gpu-runner
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # checkout stores the token in .git/config unless told not to, where it
          # can leak into anything that later archives the workspace.
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install dependencies
        run: uv sync --group test

      - name: Run GPU tests
        run: uv run pytest -m "not e2e and not cpu" --tb=short --durations=10
