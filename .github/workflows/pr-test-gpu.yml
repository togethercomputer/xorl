name: GPU Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: gpu-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-tests:
    # This job runs on a self-hosted H100. On a public repository a pull request
    # from a fork must never reach that host: the runner would execute the
    # fork's code, with its checkout, its workflow-adjacent scripts and its test
    # payloads, on hardware inside our network. Restrict the job to refs that
    # live in this repository. Fork contributions are still covered by the CPU
    # job, which runs on an ephemeral GitHub-hosted runner; a maintainer who
    # wants GPU coverage for a fork PR pushes the branch to this repo first.
    if: >-
      github.event_name == 'push' ||
      (!github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted-h100-2gpu-cu131
    timeout-minutes: 30
    container:
      # Matches the CUDA 13.2 torch/triton wheels pinned in ``pyproject.toml``.
      # Kernel backends that compile at runtime (TileLang, FlashQLA) need an
      # ``nvcc`` from the same CUDA major/minor line as those wheels.
      image: nvcr.io/nvidia/cuda:13.2.1-cudnn-devel-ubuntu24.04

    steps:
      - name: Install system tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install dependencies
        run: uv sync --group test

      - name: Run GPU tests
        run: uv run pytest -m "not e2e and not cpu" --tb=short --durations=10
