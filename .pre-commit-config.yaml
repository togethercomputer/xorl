default_stages: [pre-commit, pre-push, manual]
# Vendored trees and byte-contract-gated files are never rewritten by any
# hook: quack/ and flashqla/ are third-party snapshots (see their VENDORED.md),
# and bi_families_v2.py is vendored byte-identical into the serving engine
# with both copies sha256-gated, so it keeps that engine's formatting
# (black, 88 columns). See src/xorl/ops/README.md.
exclude: ^(submodules/|\.venv/|src/xorl/ops/_vendored/|src/xorl/ops/bi_families_v2\.py$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-ast
      - id: check-added-large-files
        # The semantic audit ledger intentionally retains evidence for every
        # reviewed scope. Keep the size guard for all other additions.
        exclude: ^test_audit_decisions\.json$
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: debug-statements
      - id: no-commit-to-branch
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        args: [--fix-only]
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ["--config", ".codespellrc"]
        additional_dependencies:
          - tomli
  - repo: local
    hooks:
      - id: check-public-tree
        name: check public tree for private references
        entry: python scripts/check_public_tree.py
        language: system
        pass_filenames: false
