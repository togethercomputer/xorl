model:
  model_path: Qwen/Qwen3.6-35B-A3B
  attn_implementation: flash_attention_3
  moe_implementation: quack
  ep_dispatch: deepep
  train_router: false
  deepep_buffer_size_gb: 2.0
  deepep_num_sms: 72
  deepep_async_combine: true
data:
  datasets:
  - path: dummy
    type: tokenized
    max_seq_len: 8193
  select_columns:
  - input_ids
  - labels
  dataset_prepared_path: last_prepared_dataset
  sample_packing_method: sequential
  sample_packing_sequence_len: 8193
  dataloader_num_workers: 4
  dataloader_prefetch_factor: 2
  dataloader_pin_memory: true
  dataloader_drop_last: true
  pad_to_multiple_of: 128
train:
  output_dir: outputs/xorl-sim/qwen3_6_35b_a3b_8k_4node_ep8_mbs8_fullrecompute_deepep
  data_parallel_mode: fsdp2
  pipeline_parallel_size: 1
  ulysses_parallel_size: 1
  ringattn_parallel_size: 1
  tensor_parallel_size: 1
  data_parallel_replicate_size: 1
  data_parallel_shard_size: 32
  expert_parallel_size: 8
  num_train_epochs: 1
  max_steps: 12
  micro_batch_size: 8
  gradient_accumulation_steps: 1
  empty_cache_steps: 10
  gc_steps: 10
  gradient_checkpointing_method: recompute_full_layer
  optimizer: adamw
  lr: 1.0e-05
  lr_warmup_ratio: 0.0
  lr_decay_style: cosine
  lr_decay_ratio: 1.0
  weight_decay: 0.01
  max_grad_norm: 1.0
  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  enable_compile: true
  enable_full_shard: true
  init_device: meta
  load_weights_mode: grouped
  enable_full_determinism: false
  ckpt_manager: dcp
  save_steps: 0
  save_epochs: 0
  save_hf_weights: false
  log_format: structured
  use_wandb: false
